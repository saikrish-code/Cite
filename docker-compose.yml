version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: citerag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma/
    ports:
      - "8001:8000"
    environment:
      - ALLOW_RESET=TRUE
      - IS_PERSISTENT=TRUE

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/citerag
      - CHROMA_SERVER_HOST=chroma
      - CHROMA_SERVER_PORT=8000
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=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
      - OPENAI_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_MODEL=openai/gpt-oss-120b
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    # Mount local chroma_data just in case fallback is triggered, though we use server host now
    volumes:
      - backend_chroma_fallback:/app/chroma_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
  backend_chroma_fallback:
